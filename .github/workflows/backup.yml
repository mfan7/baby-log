name: Weekly DB backup

# Dumps the Postgres `public` schema (where care_logs lives) to a private
# GitHub Actions artifact. The artifact is visible only to repo collaborators
# and is NOT committed to this (public) repo, so personal data stays private.
#
# ── One-time setup ──────────────────────────────────────────────────────────
# 1. Supabase Dashboard → Project Settings → Database → Connection string.
#    Choose the **Session pooler** tab (IPv4-compatible; GitHub runners are
#    IPv4-only, and the pooler's session mode supports pg_dump). Copy the URI
#    and put your database password into it.
# 2. GitHub → repo → Settings → Secrets and variables → Actions → New secret:
#      Name:  SUPABASE_DB_URL
#      Value: the full connection URI from step 1
# 3. Merge this workflow to the default branch (`main`). Scheduled workflows
#    only run from the default branch.
#
# Run it any time from the Actions tab via "Run workflow" (workflow_dispatch).
# Download a backup from the finished run's "Artifacts" section.
#
# Notes:
#  - GitHub disables scheduled workflows after 60 days with no repo activity;
#    a manual run or any commit re-arms it.
#  - Artifacts here are retained 90 days. For long-term keeping, download the
#    ones you want to archive.
#  - Restore with:  psql "$SUPABASE_DB_URL" -f baby-log-backup-<timestamp>.sql

on:
  schedule:
    - cron: '17 8 * * 0'   # Sundays 08:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump public schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. See workflow header for setup."
            exit 1
          fi
          ts=$(date -u +%Y%m%d-%H%M%S)
          out="baby-log-backup-${ts}.sql"
          # pg_dump from the postgres:17 image dumps servers up to v17 safely.
          docker run --rm -e SUPABASE_DB_URL postgres:17 \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges' \
            > "$out"
          ls -lh "$out"
          # Fail loudly if the dump came back empty.
          test -s "$out"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: baby-log-backup-*.sql
          retention-days: 90
          if-no-files-found: error
